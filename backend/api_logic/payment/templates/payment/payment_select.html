{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Payment Method</title>
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --light: #f8f9fa;
            --dark: #212529;
            --success: #4cc9f0;
            --danger: #f72585;
            --border-radius: 12px;
            --shadow: 0 10px 20px rgba(0,0,0,0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--dark);
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .payment-methods {
            padding: 25px;
        }

        .payment-methods h2 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--dark);
            font-weight: 500;
        }

        .payment-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .payment-option {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
        }

        .payment-option:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .payment-option.selected {
            border-color: var(--primary);
            background-color: rgba(67, 97, 238, 0.05);
        }

        .payment-icon {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 10px;
            margin-right: 15px;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .payment-details {
            flex: 1;
        }

        .payment-details h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .payment-details p {
            font-size: 0.85rem;
            color: #6c757d;
        }

        .radio-btn {
            width: 20px;
            height: 20px;
            border: 2px solid #adb5bd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .radio-btn::after {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
            opacity: 0;
            transition: var(--transition);
        }

        .payment-option.selected .radio-btn {
            border-color: var(--primary);
        }

        .payment-option.selected .radio-btn::after {
            opacity: 1;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            display: block;
            text-decoration: none;
        }

        .btn-secondary {
            background: #e9ecef;
            color: var(--dark);
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }

        .security-notice {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #6c757d;
        }

        .security-notice i {
            margin-right: 8px;
            color: #28a745;
        }

        @media (max-width: 480px) {
            .container {
                max-width: 100%;
            }
            
            .header {
                padding: 20px 15px;
            }
            
            .payment-methods {
                padding: 20px 15px;
            }
            
            .form-actions {
                flex-direction: column;
            }
        }
    </style>
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Complete Your Payment</h1>
            <p>Choose your preferred payment method</p>
        </div>
        
        <div class="payment-methods">
            <h2>Select Payment Method</h2>
            
            <form method="POST" id="paymentForm">
                {% csrf_token %}
                <div class="payment-options">
                    <label class="payment-option" for="easypaisa">
                        <div class="payment-icon">
                            <i>EP</i>
                        </div>
                        <div class="payment-details">
                            <h3>EasyPaisa</h3>
                            <p>Pay via EasyPaisa wallet or bank account</p>
                        </div>
                        <div class="radio-btn"></div>
                        <input type="radio" name="method" value="easypaisa" id="easypaisa" style="display: none;">
                    </label>
                    
                    <label class="payment-option" for="jazzcash">
                        <div class="payment-icon">
                            <i>JC</i>
                        </div>
                        <div class="payment-details">
                            <h3>JazzCash</h3>
                            <p>Pay via JazzCash wallet or mobile account</p>
                        </div>
                        <div class="radio-btn"></div>
                        <input type="radio" name="method" value="jazzcash" id="jazzcash" style="display: none;">
                    </label>
                    
                    <label class="payment-option" for="cod">
                        <div class="payment-icon">
                            <i>COD</i>
                        </div>
                        <div class="payment-details">
                            <h3>Cash on Delivery</h3>
                            <p>Pay when you receive your order</p>
                        </div>
                        <div class="radio-btn"></div>
                        <input type="radio" name="method" value="cod" id="cod" style="display: none;">
                    </label>
                </div>

                <div class="form-actions">
                <a href="{% url 'payment' order.id %}">Cancel</a>


                    <button type="submit" class="btn btn-primary">Continue to Payment</button>
                </div>
            </form>
            
            <div class="security-notice">
                <i>🔒</i> Your payment information is secure and encrypted
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const paymentOptions = document.querySelectorAll('.payment-option');
            
            paymentOptions.forEach(option => {
                option.addEventListener('click', function() {
                    // Remove selected class from all options
                    paymentOptions.forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    
                    // Add selected class to clicked option
                    this.classList.add('selected');
                    
                    // Check the corresponding radio button
                    const radio = this.querySelector('input[type="radio"]');
                    radio.checked = true;
                });
            });
            
            // Auto-select first option if none selected
            const form = document.getElementById('paymentForm');
            form.addEventListener('submit', function(e) {
                const selectedMethod = document.querySelector('input[name="method"]:checked');
                if (!selectedMethod) {
                    e.preventDefault();
                    alert('Please select a payment method');
                }
            });
        });
    </script>
</body>
</html>
